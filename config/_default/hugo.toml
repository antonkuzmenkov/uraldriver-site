baseURL = "https://uraldriver.ru/"
defaultContentLanguage = "ru"
title = "Урал-Драйвер"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
enableEmoji = true

# Не строим списки (фазы/блог/категории) — всё SPA через #hash
# home отключаем чтобы static/index.html (дизайнерский SPA) попал в public/
disableKinds = ["home", "taxonomy", "term", "RSS"]

[pagination]
  pagerSize = 100

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

# Разрешаем raw HTML/SVG в Markdown — нужно для inline-диаграмм
[markup.goldmark.renderer]
  unsafe = true
