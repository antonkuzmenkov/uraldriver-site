baseURL = "https://uraldriver.ru/"
defaultContentLanguage = "ru"
title = "Урал-Драйвер"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
enableEmoji = true

# Не строим списки (фазы/блог/категории) — всё SPA через #hash
# home отключаем чтобы static/index.html (дизайнерский SPA) попал в public/
disableKinds = ["home", "taxonomy", "term", "RSS", "sitemap"]

[pagination]
  pagerSize = 100

[outputs]
  home = ["HTML"]
