<style>
/* ural-driver.css — aerospace / engineering aesthetic */

:root {
  --bg: #0b0d10;
  --bg-2: #0f1216;
  --surface: #14181d;
  --surface-2: #1b2027;
  --line: #262c34;
  --line-strong: #3a424c;
  --ink: #e8ecf1;
  --ink-2: #b9c1cc;
  --dim: #6f7884;
  --accent: #ff5b1f;
  --accent-soft: rgba(255,91,31,0.12);
  --signal: #4dd0a0;
  --warn: #f5c451;
  --danger: #ff5b6e;
  --maxw: 1280px;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --serif: 'Source Serif 4', 'Source Serif Pro', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11';
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; background:none; border:none; color:inherit; cursor:pointer; }

.mono { font-family: var(--mono); font-size: 0.78em; letter-spacing: 0.04em; text-transform: uppercase; }
.dim  { color: var(--dim); }

.app { min-height: 100vh; }

/* ─── Scroll progress ──────────────────────────────────────────────────── */
.scroll-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent);
  transform-origin: 0 0;
  z-index: 100;
}

/* ─── NAV ──────────────────────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(11,13,16,0.65);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s, background .2s;
}
.nav-scrolled {
  background: rgba(11,13,16,0.92);
  border-bottom-color: var(--line);
}
.nav-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; gap: 32px;
}
.nav-brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.nav-brand-name { font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
.nav-brand-sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 2px; letter-spacing: 0.06em; text-transform: uppercase; }
.nav-menu { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 13.5px;
  color: var(--ink-2);
  transition: color .15s, background .15s;
}
.nav-link:hover { color: var(--ink); background: var(--surface); }
.nav-link.is-active { color: var(--ink); background: var(--surface); }
.nav-link-code { color: var(--dim); font-family: var(--mono); font-size: 10px; }
.nav-link.is-active .nav-link-code { color: var(--accent); }
.nav-link-star { color: var(--accent); display: inline-flex; }
.nav-link-heart { color: var(--accent); }
.nav-link-heart-ico { color: var(--accent); display: inline-flex; }
.nav-burger { display: none; flex-direction: column; gap: 4px; padding: 8px; }
.nav-burger span { width: 18px; height: 1.5px; background: var(--ink); }

@media (max-width: 980px) {
  .nav-menu { display: none; }
  .nav-burger { display: flex; margin-left: auto; }
  .nav-mobile {
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 24px 16px;
    border-top: 1px solid var(--line);
  }
}

/* ─── HERO ─────────────────────────────────────────────────────────────── */
.hero {
  position: relative;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 32px 24px 48px;
  overflow: hidden;
}
.bg-pattern {
  position: absolute; inset: 0;
  pointer-events: none;
  color: var(--line);
  width: 100%; height: 100%;
}

/* ─── HERO COSMIC: Земля + орбита + звёзды ─────────────────────────────── */
.hero-cosmic {
  max-width: 100%;
  padding: 56px 0 96px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.hero-cosmic > .hero-meta,
.hero-cosmic > .hero-grid,
.hero-cosmic > .hero-facts {
  max-width: var(--maxw);
  margin-left: auto;
  margin-right: auto;
  padding-left: 24px;
  padding-right: 24px;
}
.space-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ─── Глобальный backdrop по маршруту (внутренние страницы) ─────────────── */
/* body — чёрный, .app — прозрачный, .route-backdrop fixed на z-index 0,
   все остальные дети .app поднимаем на z-index 1+, чтобы не перекрывать. */
body { background: #05070b !important; }
.app { background: transparent !important; }
.route-backdrop {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
}
.route-backdrop .space-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}
.app > .nav,
.app > main,
.app > footer,
.app > section,
.app > .scene-section,
.app > .page,
.app > article,
.app > .scroll-progress {
  position: relative;
  z-index: 1;
}
.app > .scroll-progress { z-index: 100; }
.app > .nav { z-index: 50; }
/* Контент внутренних страниц — выше фона */
.app[data-route="concept"] .page,
.app[data-route="site"] .page,
.app[data-route="economics"] .page,
.app[data-route="roadmap"] .page,
.app[data-route="phase05"] .page,
.app[data-route="competitors"] .page,
.app[data-route="blog"] .page,
.app[data-route="support"] .page {
  position: relative;
  z-index: 2;
}
/* Карточки на внутренних страницах с фоном — полупрозрачные с blur */
.app[data-route="concept"] .frame,
.app[data-route="site"] .frame,
.app[data-route="economics"] .frame,
.app[data-route="roadmap"] .frame,
.app[data-route="phase05"] .frame,
.app[data-route="competitors"] .frame,
.app[data-route="blog"] .frame,
.app[data-route="support"] .frame {
  background-color: rgba(20, 24, 29, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.app[data-route="phase05"] .page-title,
.app[data-route="phase05"] .feature-title,
.app[data-route="concept"] .page-title,
.app[data-route="site"] .page-title,
.app[data-route="economics"] .page-title,
.app[data-route="roadmap"] .page-title,
.app[data-route="competitors"] .page-title,
.app[data-route="blog"] .page-title,
.app[data-route="support"] .page-title {
  text-shadow: 0 2px 16px rgba(0,0,0,0.7);
}

/* ─── Секции-планеты на главной (вниз — продолжение космоса) ────────────── */
.scene-section {
  position: relative;
  overflow: hidden;
  /* Внутри лежит .space-bg + контент section */
}
.scene-section > .section {
  position: relative;
  z-index: 2;
}
/* Карточки на фоне планет — полупрозрачный фон + размытие */
.scene-section .frame,
.scene-section .pillar,
.scene-section .tech,
.scene-section .chapters-acc,
.scene-section .changelog,
.scene-section .phasebar-track,
.scene-section .phasebar-detail {
  background-color: rgba(20, 24, 29, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.scene-section .chapter-acc-head,
.scene-section .chapter-acc-body,
.scene-section .phasebar-cell {
  background-color: transparent;
}
.scene-section .chapter-acc-head:hover,
.scene-section .phasebar-cell:hover {
  background-color: rgba(255,255,255,0.04);
}
.scene-section .chapter-acc.is-open .chapter-acc-head,
.scene-section .phasebar-cell.is-open {
  background-color: rgba(255,91,31,0.06);
}
/* Заголовки секций должны хорошо читаться поверх планет */
.scene-section .section-title,
.scene-section .feature-title,
.scene-section .quote-body {
  text-shadow: 0 2px 16px rgba(0,0,0,0.7);
}
.hero-cosmic .hero-meta,
.hero-cosmic .hero-grid,
.hero-cosmic .hero-facts {
  position: relative;
  z-index: 2;
}
.hero-cosmic .hero-title {
  text-shadow: 0 2px 32px rgba(0,0,0,0.6);
}
.hero-cosmic .hero-meta {
  border-bottom-color: rgba(38,44,52,0.55);
  backdrop-filter: blur(2px);
}
.hero-cosmic .hero-facts {
  border-top-color: rgba(38,44,52,0.55);
  backdrop-filter: blur(2px);
}
.hero-meta {
  position: relative;
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
  color: var(--dim);
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 48px;
}
.hero-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
  align-items: start;
}
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 32px; } }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 24px;
}
.eyebrow-dot { width: 6px; height: 6px; background: var(--accent); display: inline-block; }

.hero-title {
  font-family: var(--serif);
  font-size: clamp(44px, 6.5vw, 88px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  font-weight: 400;
  margin: 0 0 24px;
  text-wrap: balance;
}
.hero-line { display: block; }

.hero-italic {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(20px, 2.2vw, 26px);
  line-height: 1.35;
  color: var(--ink-2);
  margin: 0 0 24px;
  max-width: 32ch;
}
.hero-body {
  font-size: 16.5px;
  line-height: 1.65;
  color: var(--ink-2);
  max-width: 56ch;
  margin: 0 0 32px;
}
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }

.hero-side { padding-top: 8px; }
.hero-svg { width: 100%; height: auto; display: block; color: var(--ink-2); }
.hero-svg-foot {
  text-align: center; padding: 8px 0 0;
  color: var(--dim); font-size: 9.5px; letter-spacing: 0.12em;
}

.hero-facts {
  position: relative;
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
}
@media (max-width: 700px) { .hero-facts { grid-template-columns: repeat(2, 1fr); gap: 24px; } }
.hero-fact-v {
  font-family: var(--serif);
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 400;
  letter-spacing: -0.02em;
  margin-top: 6px;
  color: var(--ink);
}
.hero-fact .mono { color: var(--dim); font-size: 10px; }
.hero-fact-note {
  margin-top: 6px;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  color: var(--accent);
  opacity: 0.85;
  line-height: 1.4;
}

/* ─── BUTTONS ──────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.005em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .15s;
  text-decoration: none;
}
.btn-primary {
  background: var(--accent);
  color: #0b0d10;
}
.btn-primary:hover { background: #ff7340; }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-strong);
}
.btn-ghost:hover { border-color: var(--ink); background: var(--surface); }

/* ─── FRAME (cards with corner marks) ──────────────────────────────────── */
.frame {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 24px;
}
.corner {
  position: absolute; width: 8px; height: 8px;
  border: 1px solid var(--accent);
  pointer-events: none;
}
.corner-tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.corner-tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
.corner-bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
.corner-br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.frame-tag {
  position: absolute; top: -10px; left: 16px;
  background: var(--bg);
  padding: 2px 8px;
  font-family: var(--mono); font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─── SECTION ──────────────────────────────────────────────────────────── */
.section {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 80px 24px;
}
.section-head { margin-bottom: 40px; max-width: 60ch; }
.section-head-meta { display: flex; gap: 16px; margin-bottom: 14px; }
.section-title {
  font-family: var(--serif);
  font-size: clamp(28px, 3.8vw, 44px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.section-sub {
  margin: 16px 0 0;
  font-size: 16px;
  color: var(--ink-2);
  line-height: 1.6;
  max-width: 64ch;
}

/* ─── PILLARS ──────────────────────────────────────────────────────────── */
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .pillars { grid-template-columns: 1fr; } }
.pillar { padding: 32px 28px; }
.pillar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.pillar-icon { color: var(--accent); }
.pillar-title {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 400;
  margin: 0 0 12px;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.pillar-body { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); margin: 0 0 20px; }
.pillar-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  display: inline-block;
  padding: 3px 8px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
  border: 1px solid var(--line-strong);
}
.tag-high { color: var(--danger); border-color: var(--danger); }
.tag-direct { color: var(--accent); border-color: var(--accent); }
.tag-med { color: var(--warn); border-color: var(--warn); }
.tag-low { color: var(--signal); border-color: var(--signal); }

/* ─── FEATURE (Прометей-РФ) ────────────────────────────────────────────── */
.feature {
  background: linear-gradient(180deg, transparent 0, var(--accent-soft) 50%, transparent 100%);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.feature-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line-strong);
  color: var(--accent);
  font-size: 11px;
}
.feature-bar svg { vertical-align: -1px; margin-right: 4px; }
.feature-grid {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: start;
}
@media (max-width: 900px) { .feature-grid { grid-template-columns: 1fr; gap: 32px; } }
.feature-title {
  font-family: var(--serif);
  font-size: clamp(40px, 5vw, 64px);
  letter-spacing: -0.025em;
  font-weight: 400;
  margin: 0;
  line-height: 1;
}
.feature-italic {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--ink-2);
  margin: 8px 0 24px;
}
.feature-lede {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink);
  margin: 0 0 24px;
  max-width: 50ch;
}
.feature-why {
  border-left: 2px solid var(--accent);
  padding: 4px 0 4px 16px;
  margin: 0 0 28px;
}
.feature-why .mono { font-size: 10.5px; color: var(--accent); margin-bottom: 6px; display: block; }
.feature-why p { margin: 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.6; }

.feature-specs { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; margin-bottom: 24px; }
.feature-spec { display: flex; flex-direction: column; gap: 4px; }
.feature-spec-v {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: -0.01em;
}
.feature-funding-h { margin-bottom: 12px; display: block; }
.feature-funding { padding-top: 16px; border-top: 1px solid var(--line); }
.funding-row { margin-bottom: 12px; }
.funding-row:last-child { margin-bottom: 0; }
.funding-row-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.funding-bar { height: 3px; background: var(--bg-2); position: relative; overflow: hidden; }
.funding-bar-lg { height: 6px; margin-top: 12px; }
.funding-fill { height: 100%; background: var(--accent); }
.funding-note { font-size: 9.5px !important; margin-top: 4px; }

/* ─── PHASE TIMELINE ───────────────────────────────────────────────────── */
.phasebar { width: 100%; margin: 0 0 16px; }
.phasebar-track {
  display: flex;
  border: 1px solid var(--line);
  background: var(--surface);
}
.phasebar-cell {
  flex: 1;
  padding: 18px 16px;
  border-right: 1px solid var(--line);
  text-align: left;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background .15s;
  min-width: 0;
}
.phasebar-cell:last-child { border-right: 0; }
.phasebar-cell:hover { background: var(--surface-2); }
.phasebar-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.phasebar-star { color: var(--accent); display: inline-flex; }
.phasebar-title {
  font-family: var(--serif);
  font-size: 17px;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
  line-height: 1.15;
}
.phasebar-period { font-size: 10px; color: var(--dim); margin-bottom: 4px; }
.phasebar-budget { font-size: 11px; color: var(--accent); }

.phasebar-now { background: var(--surface-2); }
.phasebar-now .phasebar-title { color: var(--ink); }
.phasebar-next { border-top: 2px solid var(--accent); }
.phasebar-planned { opacity: 0.85; }
.phasebar-horizon { opacity: 0.55; }

.phasebar-legend {
  display: flex; gap: 24px; flex-wrap: wrap;
  font-size: 10.5px;
  padding-top: 8px;
}
.phasebar-legend .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 0; }
.dot-now { background: var(--ink); }
.dot-next { background: var(--accent); }
.dot-planned { background: var(--ink-2); opacity: 0.7; }
.dot-horizon { background: var(--dim); }

@media (max-width: 900px) {
  .phasebar-track { flex-direction: column; }
  .phasebar-cell { border-right: 0; border-bottom: 1px solid var(--line); }
}

/* ─── TECH STACK GRID ──────────────────────────────────────────────────── */
.techgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 800px) { .techgrid { grid-template-columns: 1fr; } }
.tech { padding: 24px; transition: transform .15s, border-color .15s; }
.tech:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.tech-id {
  display: inline-block;
  font-size: 10.5px;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 3px 8px;
  margin-bottom: 16px;
}
.tech-what { font-size: 17px; margin-bottom: 12px; line-height: 1.3; }
.tech-proof { font-size: 11px; color: var(--ink-2); margin-bottom: 4px; text-transform: none; letter-spacing: 0.02em; }
.tech-city { font-size: 10.5px; color: var(--dim); }

/* ─── CHAPTERS INDEX ───────────────────────────────────────────────────── */
.chapters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
@media (max-width: 700px) { .chapters { grid-template-columns: 1fr; } }
.chapter {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  background: var(--bg);
  transition: background .15s;
}
.chapter:hover { background: var(--surface); }
.chapter-n { color: var(--accent); font-size: 14px; }
.chapter-t { font-size: 15px; }
.chapter-meta { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--dim); }
.chip {
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
}
.chip-new { background: var(--accent); color: var(--bg); }
.chip-upd { border: 1px solid var(--line-strong); color: var(--ink-2); }

/* ─── CHAPTERS ACCORDION ───────────────────────────────────────────────── */
.chapters-acc {
  border: 1px solid var(--line);
  background: var(--bg);
}
.chapter-acc {
  border-bottom: 1px solid var(--line);
}
.chapter-acc:last-child { border-bottom: 0; }
.chapter-acc-head {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  width: 100%;
  text-align: left;
  background: var(--bg);
  cursor: pointer;
  transition: background .15s;
}
.chapter-acc-head:hover { background: var(--surface); }
.chapter-acc.is-open .chapter-acc-head {
  background: var(--surface-2);
  border-bottom: 1px dashed var(--line-strong);
}
.chapter-acc.is-open .chapter-caret { color: var(--accent); }
.chapter-caret {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--dim);
  width: 16px; text-align: center;
  transition: color .15s;
}
.chapter-d { font-size: 10.5px; }
.chapter-acc-body {
  padding: 20px 24px 28px 76px;
  background: var(--surface-2);
  border-top: 0;
  animation: chapterSlide .25s ease-out;
}
@keyframes chapterSlide {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.chapter-acc-text {
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.6;
  color: var(--ink-2);
  margin: 0 0 16px;
  max-width: 70ch;
}
.chapter-acc-kw {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin: 0 0 16px;
}
.chapter-acc-foot {
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.chapter-acc-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.chapter-acc-link:hover { text-decoration: underline; }
@media (max-width: 700px) {
  .chapter-acc-body { padding: 20px 20px 28px 20px; }
  .chapter-acc-head { grid-template-columns: 40px 1fr auto; gap: 10px; }
}

/* ─── 4 СЦЕНАРИЯ ЗАГРУЗКИ (loadgrid) ───────────────────────────────────── */
.loadgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
@media (max-width: 900px) { .loadgrid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .loadgrid { grid-template-columns: 1fr; } }
.loadcard {
  padding: 20px;
  display: flex; flex-direction: column; gap: 6px;
}
.loadcard-name {
  font-size: 11px; letter-spacing: 0.08em;
  color: var(--dim); margin-bottom: 6px;
}
.loadcard-traffic {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink-2);
}
.loadcard-cost {
  font-family: var(--serif);
  font-size: 26px;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.loadcard-desc {
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--ink-2);
  margin: 0;
}
.loadcard-best  .loadcard-cost { color: var(--signal); }
.loadcard-best  { border-color: var(--signal); }
.loadcard-good  .loadcard-cost { color: var(--accent); }
.loadcard-good  { border-color: var(--accent); }
.loadcard-med   .loadcard-cost { color: var(--warn); }
.loadcard-bad   .loadcard-cost { color: var(--danger); }
.loadcard-bad   { border-color: var(--danger); }

/* ─── РЫЧАГИ $/кг (LeversAccordion) ────────────────────────────────────── */
.levers-acc {
  border: 1px solid var(--line);
  background: var(--bg);
  margin-bottom: 32px;
}
.levers-acc-head,
.lev-row-head {
  display: grid;
  grid-template-columns: 40px 1fr 90px 110px 90px 90px;
  gap: 12px;
  align-items: center;
  padding: 14px 18px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.levers-acc-head {
  cursor: default;
  background: var(--surface-2);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--line);
}
.lev-row { border-bottom: 1px solid var(--line); }
.lev-row:last-child { border-bottom: 0; }
.lev-row-head:hover { background: var(--surface); }
.lev-row.is-open .lev-row-head {
  background: var(--surface-2);
  border-bottom: 1px dashed var(--line-strong);
}
.lev-n { color: var(--accent); font-size: 12px; }
.lev-name { font-size: 14.5px; }
.lev-cap, .lev-load, .lev-cost, .lev-tier {
  font-size: 12px;
  letter-spacing: 0.04em;
}
.lev-cost { color: var(--accent); font-weight: 500; }
.lev-tier { color: var(--dim); }
.tier-1 .lev-cost { font-size: 14px; }
.lev-row-body {
  padding: 12px 24px 20px 70px;
  background: var(--surface-2);
  animation: chapterSlide .25s ease-out;
}
.lev-row-body p {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 70ch;
}
.lev-row-total {
  background: rgba(255,91,31,0.08);
  border-top: 2px solid var(--accent);
}
.lev-row-total .lev-row-head { cursor: default; padding: 18px; }
.lev-row-total .lev-name b { color: var(--ink); }
.lev-row-total .lev-cost { font-size: 14px; }
@media (max-width: 900px) {
  .levers-acc-head, .lev-row-head {
    grid-template-columns: 30px 1fr 70px 70px;
    gap: 8px; font-size: 11px;
  }
  .lev-load, .lev-tier { display: none; }
  .lev-row-body { padding: 12px 16px 16px 50px; }
}

.levers-bottom { margin-top: 32px; }
.levers-final {
  padding: 28px 32px;
  border-color: var(--accent);
}
.levers-final-price {
  font-family: var(--serif);
  font-size: 56px;
  letter-spacing: -0.025em;
  color: var(--accent);
  margin: 8px 0 12px;
  line-height: 1;
}
.levers-final-note {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink-2);
  margin: 0;
  max-width: 80ch;
}

/* ─── Иллюстрации (chart-fig + chart-svg) ──────────────────────────────── */
.chart-fig {
  margin: 32px 0 0;
  padding: 32px 24px 20px;
  background: rgba(20, 24, 29, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  position: relative;
}
.chart-fig::before, .chart-fig::after {
  content: ''; position: absolute; width: 8px; height: 8px;
  border: 1px solid var(--accent);
}
.chart-fig::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.chart-fig::after  { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
.chart-svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 920px;
  margin: 0 auto;
}
.chart-cap {
  margin-top: 16px;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-align: center;
}

/* ─── PHASE TIMELINE EXPANDABLE ────────────────────────────────────────── */
.phasebar-x { width: 100%; }
.phasebar-cell.is-open {
  background: var(--surface-2);
  outline: 1px solid var(--accent);
  outline-offset: -1px;
}
.phasebar-detail {
  margin-top: -1px;
  padding: 28px 32px;
  background: var(--surface);
  border: 1px solid var(--accent);
  animation: chapterSlide .25s ease-out;
}
.phasebar-detail-head {
  display: flex; justify-content: space-between; align-items: start; gap: 16px;
  padding-bottom: 16px; border-bottom: 1px dashed var(--line-strong);
  margin-bottom: 16px;
}
.phasebar-detail-title {
  font-family: var(--serif);
  font-size: 28px; font-weight: 400; letter-spacing: -0.02em;
  margin: 4px 0 0;
}
.phasebar-detail-close {
  background: none; border: 1px solid var(--line-strong);
  padding: 6px 12px; cursor: pointer;
  font-size: 11px; letter-spacing: 0.08em;
  color: var(--ink-2);
  transition: border-color .15s, color .15s;
}
.phasebar-detail-close:hover { border-color: var(--ink); color: var(--ink); }
.phasebar-detail-what {
  font-family: var(--serif);
  font-size: 17px; line-height: 1.55;
  color: var(--ink); margin: 0 0 20px;
}
.phasebar-detail-h {
  font-size: 10.5px; letter-spacing: 0.1em;
  margin-bottom: 8px; display: block;
}
.phasebar-detail-list {
  margin: 0 0 20px; padding-left: 20px;
  color: var(--ink-2); line-height: 1.7;
}
.phasebar-detail-list li { margin-bottom: 4px; font-size: 14.5px; }
.phasebar-detail-gate {
  padding: 14px 16px;
  background: var(--accent-soft);
  border-left: 2px solid var(--accent);
}
.phasebar-detail-gate p { margin: 6px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink); }

/* ─── QUOTE ────────────────────────────────────────────────────────────── */
.quote-section { padding: 64px 24px; }
.quote {
  max-width: 760px; margin: 0 auto;
  text-align: left;
  padding: 0 0 0 32px;
  border-left: 2px solid var(--accent);
  position: relative;
}
.quote-mark {
  position: absolute; left: -8px; top: -16px;
  color: var(--accent);
  font-size: 56px;
  line-height: 1;
  background: var(--bg);
  padding: 0 4px;
}
.quote-body {
  font-family: var(--serif);
  font-size: clamp(20px, 2.4vw, 28px);
  line-height: 1.4;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0 0 16px;
}
.quote-after {
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  color: var(--ink-2);
  margin: 0;
}

/* ─── CHANGELOG ────────────────────────────────────────────────────────── */
.changelog { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
.changelog-item {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 32px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
}
@media (max-width: 600px) { .changelog-item { grid-template-columns: 1fr; gap: 8px; } }
.changelog-date { color: var(--dim); padding-top: 4px; font-size: 11px; }
.changelog-title { font-size: 17px; margin-bottom: 8px; }
.changelog-bullets { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
.changelog-bullets li { margin-bottom: 4px; }

/* ─── FOOTER ───────────────────────────────────────────────────────────── */
.footer {
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  margin-top: 48px;
}
.footer-grid {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 56px 24px 32px;
  display: grid;
  grid-template-columns: 1.6fr 1fr 1.2fr 1.4fr;
  gap: 40px;
}
@media (max-width: 900px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
@media (max-width: 600px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-h { font-size: 11px; color: var(--dim); margin-bottom: 14px; }
.footer-tagline { font-family: var(--serif); font-size: 19px; margin-top: 6px; line-height: 1.3; }
.footer-note { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin: 16px 0 0; }
.footer-link { display: block; padding: 4px 0; font-size: 13.5px; color: var(--ink-2); transition: color .15s; }
.footer-link:hover { color: var(--ink); }
.footer-link svg { vertical-align: -1px; opacity: 0.6; }
.footer-author { font-family: var(--serif); font-size: 17px; margin: 0; }
.footer-bottom {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 16px 24px 24px;
  display: flex; justify-content: space-between;
  border-top: 1px solid var(--line);
  font-size: 10.5px;
}

/* ─── PAGE (inner pages) ───────────────────────────────────────────────── */
.page {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 32px 24px 48px;
}
.page-head {
  border-bottom: 1px solid var(--line);
  padding: 32px 0 40px;
  margin-bottom: 40px;
}
.page-head-meta { display: flex; gap: 20px; margin-bottom: 20px; font-size: 11px; }
.page-title {
  font-family: var(--serif);
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 400;
  letter-spacing: -0.025em;
  line-height: 1;
  margin: 0 0 24px;
  text-wrap: balance;
}
.page-lede {
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.45;
  color: var(--ink-2);
  max-width: 60ch;
  margin: 0;
}
.page-foot {
  margin-top: 48px; padding-top: 32px;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}

/* ─── PHASE 0.5 specific ───────────────────────────────────────────────── */
.phase-hero {
  display: grid; grid-template-columns: 2fr 1fr; gap: 24px;
  margin-bottom: 64px;
}
@media (max-width: 900px) { .phase-hero { grid-template-columns: 1fr; } }
.phase-hero-vis { padding: 32px; }
.lab-svg { width: 100%; height: auto; color: var(--ink-2); display: block; }
.big-spec { padding: 16px 0; border-bottom: 1px solid var(--line); }
.big-spec:last-child { border-bottom: 0; }
.big-spec-v {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -0.02em;
  margin-top: 4px;
}

.two-col { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: start; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
.prose p { font-size: 16px; line-height: 1.7; color: var(--ink-2); margin: 0 0 16px; }
.prose b { color: var(--ink); font-weight: 500; }

.valley { padding: 8px 0; }
.valley-row { display: grid; grid-template-columns: 80px 1fr 110px; gap: 12px; align-items: center; padding: 10px 0; }
.valley-bar { height: 8px; background: var(--bg-2); }
.valley-bar > div { height: 100%; background: var(--ink-2); }
.valley-row-star { padding: 14px 0; }
.valley-row-star span:first-child { color: var(--accent); }
.valley-gap { justify-content: center; padding: 6px 0; opacity: 0.5; display: block; text-align: center; }
.valley-note { font-size: 13px; color: var(--ink-2); margin: 16px 0 0; line-height: 1.6; }

.funding-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 1100px) { .funding-grid { grid-template-columns: repeat(2, 1fr); } }
.funding-card { padding: 20px; }
.funding-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.funding-card-share { font-family: var(--serif); font-size: 32px; letter-spacing: -0.02em; color: var(--accent); }
.funding-card-src { font-size: 15px; margin-bottom: 4px; }
.funding-card-note { font-size: 10px; }

.mini-roadmap { border-top: 1px solid var(--line); }
.mini-roadmap-row {
  display: grid; grid-template-columns: 200px 1fr; gap: 24px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
}
@media (max-width: 700px) { .mini-roadmap-row { grid-template-columns: 1fr; gap: 6px; } }
.mini-roadmap-time { color: var(--accent); padding-top: 4px; font-size: 11px; }
.mini-roadmap-h { font-size: 17px; margin-bottom: 6px; }
.mini-roadmap-b { font-size: 14px; color: var(--ink-2); line-height: 1.6; }

/* ─── ROADMAP DETAIL ───────────────────────────────────────────────────── */
.roadmap-detail { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
.roadmap-card { padding: 24px; }
.roadmap-card-head {
  display: flex; justify-content: space-between; gap: 24px;
  margin-bottom: 12px;
}
.roadmap-card-title { font-family: var(--serif); font-size: 22px; font-weight: 400; margin: 4px 0 0; letter-spacing: -0.01em; }
.roadmap-card-meta { text-align: right; }
.roadmap-card-meta .mono:first-child { color: var(--ink); font-size: 12px; }
.roadmap-card-what { color: var(--ink-2); font-size: 14.5px; margin: 0 0 12px; line-height: 1.6; }
.roadmap-now { border-color: var(--ink); }
.roadmap-next { border-color: var(--accent); }

/* ─── COMPETITORS ──────────────────────────────────────────────────────── */
.comp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .comp-grid { grid-template-columns: 1fr; } }
.comp { padding: 24px; }
.comp-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 16px; }
.comp-name { font-family: var(--serif); font-size: 22px; font-weight: 400; margin: 0; letter-spacing: -0.01em; }
.comp-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12px; gap: 16px; }
.comp-row:last-of-type { border-bottom: 0; margin-bottom: 12px; }
.comp-sig { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; margin: 8px 0 0; }
.comp-direct { border-color: var(--accent); }

/* ─── PLACEHOLDER ──────────────────────────────────────────────────────── */
.placeholder-list { display: flex; flex-direction: column; gap: 12px; }
.placeholder-row { padding: 18px 24px; display: grid; grid-template-columns: 100px 1fr; gap: 24px; align-items: center; }
.placeholder-row-t { font-size: 15px; }

/* ─── SUPPORT ──────────────────────────────────────────────────────────── */
.support-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 800px) { .support-grid { grid-template-columns: 1fr; } }
.support-card { padding: 24px; }
.support-card-head { margin-bottom: 12px; font-size: 11px; }
.support-card-what { font-size: 16px; margin-bottom: 12px; line-height: 1.4; }
.support-card-amt {
  font-family: var(--serif);
  font-size: 28px;
  letter-spacing: -0.02em;
  color: var(--accent);
  margin-bottom: 6px;
}
.support-card-pub { font-size: 10.5px; }
.support-legal { margin-top: 24px; padding: 12px; border: 1px dashed var(--line-strong); }

.channels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
@media (max-width: 700px) { .channels { grid-template-columns: 1fr; } }
.channel {
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  padding: 20px 24px; background: var(--bg);
  transition: background .15s;
}
.channel:hover { background: var(--surface); }
.channel-name { font-size: 15px; }
.channel-handle { font-size: 11px; color: var(--accent); margin-top: 2px; grid-column: 1; }
.channel-arrow { color: var(--ink-2); }

/* ─── STAT ─────────────────────────────────────────────────────────────── */
.stat { padding: 12px 0; }
.stat-value { font-family: var(--serif); font-size: 36px; letter-spacing: -0.02em; line-height: 1; }
.stat-label { font-size: 10.5px; color: var(--dim); margin-top: 6px; }

/* ─── MOTION ───────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: no-preference) {
  .pillar, .tech, .frame { animation: fadeUp .5s ease-out backwards; }
  .pillars .pillar:nth-child(2) { animation-delay: .08s; }
  .pillars .pillar:nth-child(3) { animation-delay: .16s; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

// ─── Звёздное поле (используется во всех backdrop'ах) ──────────────────────
const StarField = ({ seed = 1337, count = 150, vbW = 1600, vbH = 800 }) => {
  const stars = React.useMemo(() => {
    const arr = [];
    let s = seed;
    const rand = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for (let i = 0; i < count; i++) {
      const r = rand();
      arr.push({
        cx: rand() * vbW,
        cy: rand() * vbH,
        r: r < 0.85 ? 0.6 : r < 0.97 ? 1.0 : 1.6,
        o: 0.25 + rand() * 0.65,
        twinkle: rand() > 0.7,
        delay: rand() * 4,
      });
    }
    return arr;
  }, [seed, count, vbW, vbH]);
  return (
    <g className="stars">
      {stars.map((s, i) => (
        <circle key={i} cx={s.cx} cy={s.cy} r={s.r} fill="#dfe7f4" opacity={s.o}>
          {s.twinkle && (
            <animate attributeName="opacity" values={`${s.o};${s.o * 0.25};${s.o}`}
                     dur={`${3 + s.delay}s`} repeatCount="indefinite" begin={`${s.delay}s`}/>
          )}
        </circle>
      ))}
    </g>
  );
};

// ─── SVG: Waterfall-диаграмма рычагов снижения $/кг ─────────────────────
const WaterfallChart = () => {
  const start = 230;  // $/кг базовое (сценарий Б)
  // Δ подобраны так, чтобы 230 + Σδ = 103 (середина диапазона $95-110)
  const steps = [
    { label: 'Базовая Б',          delta: 0,    fill: '#4a5058', isStart: true },
    { label: '01 · 2-я нитка',     delta: -80,  fill: '#ff5b1f' },
    { label: '02 · 12–15 т',       delta: -28,  fill: '#ff5b1f' },
    { label: '03 · скайхук',       delta: -10,  fill: '#ff7340' },
    { label: '04 · АЭС PPA',       delta: -3,   fill: '#ff7340' },
    { label: '05 · унификация',    delta: -3,   fill: '#ff7340' },
    { label: '06 · выработки',     delta: -2,   fill: '#ff8a55' },
    { label: '07 · криогеника',    delta: -1,   fill: '#ff8a55' },
    { label: 'Итог',               delta: 0,    fill: '#4dd0a0', isEnd: true },
  ];
  const W = 900, H = 360, padL = 60, padR = 30, padT = 40, padB = 80;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const barW = innerW / steps.length * 0.7;
  const gap = innerW / steps.length;
  const maxV = 250;  // верх шкалы
  const yScale = v => padT + innerH - (v / maxV) * innerH;
  let running = start;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart-svg" aria-label="Рычаги снижения $/кг">
      {/* gridlines */}
      {[0, 50, 100, 150, 200, 250].map(v => (
        <g key={v}>
          <line x1={padL} y1={yScale(v)} x2={W - padR} y2={yScale(v)}
                stroke="#262c34" strokeWidth="0.5"/>
          <text x={padL - 8} y={yScale(v) + 4} fill="#6f7884"
                fontFamily="JetBrains Mono, monospace" fontSize="10" textAnchor="end">
            ${v}
          </text>
        </g>
      ))}
      {/* bars */}
      {steps.map((s, i) => {
        const x = padL + gap * i + (gap - barW) / 2;
        let y, h, label;
        if (s.isStart) {
          y = yScale(start); h = innerH - (yScale(start) - padT);
          label = `$${start}`;
        } else if (s.isEnd) {
          y = yScale(running); h = innerH - (yScale(running) - padT);
          label = `$${Math.round(running)}`;
        } else {
          const top = running;
          running = running + s.delta;
          y = yScale(top);
          h = yScale(running) - yScale(top);
          label = `${s.delta > 0 ? '+' : ''}${s.delta}`;
        }
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={h} fill={s.fill} opacity={s.isStart||s.isEnd?0.85:0.7}/>
            <text x={x + barW/2} y={y - 6} fill="#e8ecf1"
                  fontFamily="JetBrains Mono, monospace" fontSize="10" textAnchor="middle">
              {label}
            </text>
            <text x={x + barW/2} y={H - padB + 16} fill="#b9c1cc"
                  fontFamily="Inter, sans-serif" fontSize="10" textAnchor="middle">
              {s.label.split(' · ')[0]}
            </text>
            {s.label.includes(' · ') && (
              <text x={x + barW/2} y={H - padB + 30} fill="#6f7884"
                    fontFamily="Inter, sans-serif" fontSize="9" textAnchor="middle">
                {s.label.split(' · ')[1]}
              </text>
            )}
          </g>
        );
      })}
      {/* connect dots between bar tops */}
      {steps.slice(1).map((s, i) => {
        if (s.isEnd) return null;
        return null; // упрощаем — без соединителей чтобы было чище
      })}
      {/* axis */}
      <line x1={padL} y1={padT + innerH} x2={W - padR} y2={padT + innerH}
            stroke="#3a424c" strokeWidth="1"/>
    </svg>
  );
};

  const [p, setP] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const t = h.scrollHeight - h.clientHeight;
      setP(t>0 ? window.scrollY / t : 0);
    };
    window.addEventListener('scroll', onScroll);
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="scroll-progress" style={{transform:`scaleX(${p})`}}/>;

<script type="text/babel" data-presets="react">
// app.jsx — top-level routing
const { useState: uS, useEffect: uE } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentHue": 18,
  "fontScale": 1.0,
  "showGrid": true
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = uS(() => {
    const h = (window.location.hash || '').replace('#','');
    return h && window.SITE_DATA.menu.find(m => m.id===h) ? h : 'home';
  });
  const data = window.SITE_DATA;

  uE(() => {
    window.location.hash = route;
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [route]);

  uE(() => {
    const onHash = () => {
      const h = (window.location.hash || '').replace('#','');
      if (h && data.menu.find(m=>m.id===h)) setRoute(h);
      else if (!h) setRoute('home');
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  let Page;
  switch (route) {
    case 'phase05':     Page = <PagePhase05 data={data} setRoute={setRoute}/>; break;
    case 'roadmap':     Page = <PageRoadmap data={data} setRoute={setRoute}/>; break;
    case 'competitors': Page = <PageCompetitors data={data} setRoute={setRoute}/>; break;
    case 'concept':     Page = <PageConcept data={data} setRoute={setRoute}/>; break;
    case 'site':        Page = <PageSite data={data} setRoute={setRoute}/>; break;
    case 'economics':   Page = <PageEconomics data={data} setRoute={setRoute}/>; break;
    case 'blog':        Page = <PageBlog data={data} setRoute={setRoute}/>; break;
    case 'support':     Page = <PageSupport data={data} setRoute={setRoute}/>; break;
    default:            Page = <PageHome data={data} setRoute={setRoute}/>;
  }

  return (
    <div className="app" data-route={route}>
      <RouteBackdrop route={route}/>
      <ScrollProgress/>
      <ChromeNav data={data} route={route} setRoute={setRoute}/>
      {Page}
      <ChromeFooter data={data} setRoute={setRoute}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
