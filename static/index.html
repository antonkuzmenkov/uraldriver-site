<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>

<title>Урал-Драйвер · открытый концепт</title>

<meta name="theme-color" content="#05070b"/>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="shortcut icon" href="/favicon.ico"/>

<!-- Open Graph (для соцсетей) -->
<meta property="og:title" content="Урал-Драйвер · Возвращаем мечту о Солнечной системе"/>

<style>
/* ural-driver.css — aerospace / engineering aesthetic */

:root {
  --bg: #0b0d10;
  --bg-2: #0f1216;
  --surface: #14181d;
  --surface-2: #1b2027;
  --line: #262c34;
  --line-strong: #3a424c;
  --ink: #e8ecf1;
  --ink-2: #b9c1cc;
  --dim: #6f7884;
  --accent: #ff5b1f;
  --accent-soft: rgba(255,91,31,0.12);
  --signal: #4dd0a0;
  --warn: #f5c451;
  --danger: #ff5b6e;
  --maxw: 1280px;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --serif: 'Source Serif 4', 'Source Serif Pro', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Унифицированные токены для таблиц/аккордеонов/гридов */
  --tbl-bg:        rgba(20, 24, 29, 0.78);
  --tbl-bg-hover:  rgba(255, 255, 255, 0.04);
  --tbl-bg-active: rgba(255, 91, 31, 0.07);
  --tbl-header-bg: rgba(27, 32, 39, 0.85);
  --tbl-row-border: rgba(38, 44, 52, 0.7);
  --tbl-row-border-active: rgba(255, 91, 31, 0.35);
  --tbl-pad-y: 14px;
  --tbl-pad-x: 18px;
  --tbl-radius: 0;
  --tbl-blur: 8px;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11';
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; background:none; border:none; color:inherit; cursor:pointer; }

.mono { font-family: var(--mono); font-size: 0.78em; letter-spacing: 0.04em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.dim  { color: var(--dim); }
.fact-v, .keynum-v, .big-spec-v, .funding-card-amt, .funding-card-share,
.acc-metric-v, .roadmap-card-meta .mono, .phasebar-budget {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
}

.app { min-height: 100vh; }

/* ─── Scroll progress ──────────────────────────────────────────────────── */
.scroll-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent);
  transform-origin: 0 0;
  z-index: 100;
}

/* ─── NAV ──────────────────────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(11,13,16,0.65);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s, background .2s;
}
.nav-scrolled {
  background: rgba(11,13,16,0.92);
  border-bottom-color: var(--line);
}
.nav-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; gap: 32px;
}
.nav-brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.nav-brand-name { font-weight: 600; letter-spacing: -0.01em; font-size: 15px; }
.nav-brand-sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 2px; letter-spacing: 0.06em; text-transform: uppercase; }
.nav-menu { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 13.5px;
  color: var(--ink-2);
  transition: color .15s, background .15s;
}
.nav-link:hover { color: var(--ink); background: var(--surface); }
.nav-link.is-active { color: var(--ink); background: var(--surface); }
.nav-link-code { color: var(--dim); font-family: var(--mono); font-size: 10px; }
.nav-link.is-active .nav-link-code { color: var(--accent); }
.nav-link-star { color: var(--accent); display: inline-flex; }
.nav-link-heart { color: var(--accent); }
.nav-link-heart-ico { color: var(--accent); display: inline-flex; }
.nav-burger { display: none; flex-direction: column; gap: 4px; padding: 8px; }
.nav-burger span { width: 18px; height: 1.5px; background: var(--ink); }

@media (max-width: 980px) {
  .nav-menu { display: none; }
  .nav-burger { display: flex; margin-left: auto; }
  .nav-mobile {
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 24px 16px;
    border-top: 1px solid var(--line);
  }
}

/* ─── HERO ─────────────────────────────────────────────────────────────── */
.hero {
  position: relative;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 32px 24px 48px;
  overflow: hidden;
}
.bg-pattern {
  position: absolute; inset: 0;
  pointer-events: none;
  color: var(--line);
  width: 100%; height: 100%;
}

/* ─── HERO COSMIC: Земля + орбита + звёзды ─────────────────────────────── */
.hero-cosmic {
  max-width: 100%;
  padding: 56px 0 96px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.hero-cosmic > .hero-meta,
.hero-cosmic > .hero-grid,
.hero-cosmic > .hero-facts {
  max-width: var(--maxw);
  margin-left: auto;
  margin-right: auto;
  padding-left: 24px;
  padding-right: 24px;
}
.space-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ─── Глобальный backdrop по маршруту (внутренние страницы) ─────────────── */
/* body — чёрный, .app — прозрачный, .route-backdrop fixed на z-index 0,
   все остальные дети .app поднимаем на z-index 1+, чтобы не перекрывать. */
body { background: #05070b !important; }
.app { background: transparent !important; }
.route-backdrop {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
}
.route-backdrop .space-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}
.app > .nav,
.app > main,
.app > footer,
.app > section,
.app > .scene-section,
.app > .page,
.app > article,
.app > .scroll-progress {
  position: relative;
  z-index: 1;
}
.app > .scroll-progress { z-index: 100; }
.app > .nav { z-index: 50; }

/* ─── Глобальная trajectory-линия (через всю главную) ──────────────────── */
.global-trajectory {
  position: absolute;
  top: 0; left: 0; right: 0;
  width: 100%;
  pointer-events: none;
  z-index: 0;
}
@media (prefers-reduced-motion: reduce) {
  .global-trajectory circle animate { display: none; }
}

/* ─── Глобальные UX-улучшения ──────────────────────────────────────────── */
html { scroll-behavior: smooth; color-scheme: dark; }
*::selection { background: rgba(255,91,31,0.35); color: #fff; }
*::-moz-selection { background: rgba(255,91,31,0.35); color: #fff; }

/* Кастомный scrollbar — webkit (Safari, Chrome) */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb {
  background: var(--line);
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }
/* Firefox */
* { scrollbar-color: var(--line) var(--bg); scrollbar-width: thin; }

/* Focus-visible — клавиатурная навигация */
*:focus { outline: none; }
*:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button:focus-visible, a:focus-visible {
  outline-offset: 3px;
}
/* Контент внутренних страниц — выше фона */
.app[data-route="concept"] .page,
.app[data-route="site"] .page,
.app[data-route="economics"] .page,
.app[data-route="roadmap"] .page,
.app[data-route="phase05"] .page,
.app[data-route="competitors"] .page,
.app[data-route="blog"] .page,
.app[data-route="support"] .page {
  position: relative;
  z-index: 2;
}
/* Карточки на внутренних страницах с фоном — полупрозрачные с blur */
.app[data-route="concept"] .frame,
.app[data-route="site"] .frame,
.app[data-route="economics"] .frame,
.app[data-route="roadmap"] .frame,
.app[data-route="phase05"] .frame,
.app[data-route="competitors"] .frame,
.app[data-route="blog"] .frame,
.app[data-route="support"] .frame {
  background-color: rgba(20, 24, 29, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.app[data-route="phase05"] .page-title,
.app[data-route="phase05"] .feature-title,
.app[data-route="concept"] .page-title,
.app[data-route="site"] .page-title,
.app[data-route="economics"] .page-title,
.app[data-route="roadmap"] .page-title,
.app[data-route="competitors"] .page-title,
.app[data-route="blog"] .page-title,
.app[data-route="support"] .page-title {
  text-shadow: 0 2px 16px rgba(0,0,0,0.7);
}

/* ─── Секции-планеты на главной (вниз — продолжение космоса) ────────────── */
.scene-section {
  position: relative;
  overflow: hidden;
  /* Внутри лежит .space-bg + контент section */
}
.scene-section > .section {
  position: relative;
  z-index: 2;
}
/* Карточки на фоне планет — полупрозрачный фон + размытие */
.scene-section .frame,
.scene-section .pillar,
.scene-section .tech,
.scene-section .chapters-acc,
.scene-section .changelog,
.scene-section .phasebar-track,
.scene-section .phasebar-detail {
  background-color: rgba(20, 24, 29, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.scene-section .chapter-acc-head,
.scene-section .chapter-acc-body,
.scene-section .phasebar-cell {
  background-color: transparent;
}
.scene-section .chapter-acc-head:hover,
.scene-section .phasebar-cell:hover {
  background-color: rgba(255,255,255,0.04);
}
.scene-section .chapter-acc.is-open .chapter-acc-head,
.scene-section .phasebar-cell.is-open {
  background-color: rgba(255,91,31,0.06);
}
/* Заголовки секций должны хорошо читаться поверх планет */
.scene-section .section-title,
.scene-section .feature-title,
.scene-section .quote-body {
  text-shadow: 0 2px 16px rgba(0,0,0,0.7);
}
.hero-cosmic .hero-meta,
.hero-cosmic .hero-grid,
.hero-cosmic .hero-facts {
  position: relative;
  z-index: 2;
}
.hero-cosmic .hero-title {
  text-shadow: 0 2px 32px rgba(0,0,0,0.6);
}
.hero-cosmic .hero-meta {
  border-bottom-color: rgba(38,44,52,0.55);
  backdrop-filter: blur(2px);
}
.hero-cosmic .hero-facts {
  border-top-color: rgba(38,44,52,0.55);
  backdrop-filter: blur(2px);
}
.hero-meta {
  position: relative;
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
  color: var(--dim);
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 48px;
}
.hero-grid {
  position: relative;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
  align-items: start;
}
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 32px; } }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 24px;
}
.eyebrow-dot { width: 6px; height: 6px; background: var(--accent); display: inline-block; }

.hero-title {
  font-family: var(--serif);
  font-size: clamp(44px, 6.5vw, 88px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  font-weight: 400;
  margin: 0 0 24px;
  text-wrap: balance;
}
.hero-line { display: block; }

.hero-italic {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(20px, 2.2vw, 26px);
  line-height: 1.35;
  color: var(--ink-2);
  margin: 0 0 24px;
  max-width: 32ch;
}
.hero-body {
  font-size: 16.5px;
  line-height: 1.65;
  color: var(--ink-2);
  max-width: 56ch;
  margin: 0 0 32px;
}
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }

.hero-side { padding-top: 8px; }
.hero-svg { width: 100%; height: auto; display: block; color: var(--ink-2); }
.hero-svg-foot {
  text-align: center; padding: 8px 0 0;
  color: var(--dim); font-size: 9.5px; letter-spacing: 0.12em;
}

.hero-facts {
  position: relative;
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
}
@media (max-width: 700px) { .hero-facts { grid-template-columns: repeat(2, 1fr); gap: 24px; } }
.hero-fact-v {
  font-family: var(--serif);
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 400;
  letter-spacing: -0.02em;
  margin-top: 6px;
  color: var(--ink);
}
.hero-fact .mono { color: var(--dim); font-size: 10px; }

/* ─── BUTTONS ──────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.005em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .15s;
  text-decoration: none;
}
.btn-primary {
  background: var(--accent);
  color: #0b0d10;
}
.btn-primary:hover { background: #ff7340; }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line-strong);
}
.btn-ghost:hover { border-color: var(--ink); background: var(--surface); }

/* ─── FRAME (cards with corner marks) ──────────────────────────────────── */
.frame {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 24px;
}
.corner {
  position: absolute; width: 8px; height: 8px;
  border: 1px solid var(--accent);
  pointer-events: none;
}
.corner-tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.corner-tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
.corner-bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
.corner-br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.frame-tag {
  position: absolute; top: -10px; left: 16px;
  background: var(--bg);
  padding: 2px 8px;
  font-family: var(--mono); font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─── SECTION ──────────────────────────────────────────────────────────── */
.section {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 80px 24px;
}
.section-head { margin-bottom: 40px; max-width: 60ch; }
.section-head-meta { display: flex; gap: 16px; margin-bottom: 14px; }
.section-title {
  font-family: var(--serif);
  font-size: clamp(28px, 3.8vw, 44px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.section-sub {
  margin: 16px 0 0;
  font-size: 16px;
  color: var(--ink-2);
  line-height: 1.6;
  max-width: 64ch;
}

/* ─── PILLARS ──────────────────────────────────────────────────────────── */
.pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 900px) { .pillars { grid-template-columns: 1fr; } }

/* Bullets внутри pillar-карточки */
.pillar-bullets {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  border-top: 1px dashed var(--tbl-row-border);
  padding-top: 14px;
}
.pillar-bullets li {
  position: relative;
  padding: 6px 0 6px 18px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-2);
  border-bottom: 1px dashed var(--tbl-row-border);
}
.pillar-bullets li:last-child { border-bottom: 0; }
.pillar-bullets li::before {
  content: '▸';
  position: absolute;
  left: 0; top: 6px;
  color: var(--accent);
  font-size: 11px;
}

/* Кнопка «Подробнее в [...]» */
.pillar-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 14px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .15s;
}
.pillar-link:hover {
  background: var(--accent);
  color: #fff;
}
.pillar { padding: 32px 28px; }
.pillar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.pillar-icon { color: var(--accent); }
.pillar-title {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 400;
  margin: 0 0 12px;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.pillar-body { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); margin: 0 0 20px; }
.pillar-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  display: inline-block;
  padding: 3px 8px;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-2);
  border: 1px solid var(--line-strong);
}
.tag-high { color: var(--ink-2); border-color: var(--ink-2); }
.tag-direct { color: var(--accent); border-color: var(--accent); }
.tag-peer { color: var(--signal); border-color: var(--signal); }
.tag-med { color: var(--warn); border-color: var(--warn); }
.tag-low { color: var(--dim); border-color: var(--dim); }

/* ─── FEATURE (Прометей-РФ) ────────────────────────────────────────────── */
.feature {
  background: linear-gradient(180deg, transparent 0, var(--accent-soft) 50%, transparent 100%);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.feature-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line-strong);
  color: var(--accent);
  font-size: 11px;
}
.feature-bar svg { vertical-align: -1px; margin-right: 4px; }
.feature-grid {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: start;
}
@media (max-width: 900px) { .feature-grid { grid-template-columns: 1fr; gap: 32px; } }
.feature-title {
  font-family: var(--serif);
  font-size: clamp(40px, 5vw, 64px);
  letter-spacing: -0.025em;
  font-weight: 400;
  margin: 0;
  line-height: 1;
}
.feature-italic {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--ink-2);
  margin: 8px 0 24px;
}
.feature-lede {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink);
  margin: 0 0 24px;
  max-width: 50ch;
}
.feature-why {
  border-left: 2px solid var(--accent);
  padding: 4px 0 4px 16px;
  margin: 0 0 28px;
}
.feature-why .mono { font-size: 10.5px; color: var(--accent); margin-bottom: 6px; display: block; }
.feature-why p { margin: 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.6; }

.feature-specs { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; margin-bottom: 24px; }
.feature-spec { display: flex; flex-direction: column; gap: 4px; }
.feature-spec-v {
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: -0.01em;
}
.feature-funding-h { margin-bottom: 12px; display: block; }
.feature-funding { padding-top: 16px; border-top: 1px solid var(--line); }
.funding-row { margin-bottom: 12px; }
.funding-row:last-child { margin-bottom: 0; }
.funding-row-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.funding-bar { height: 3px; background: var(--bg-2); position: relative; overflow: hidden; }
.funding-bar-lg { height: 6px; margin-top: 12px; }
.funding-fill { height: 100%; background: var(--accent); }
.funding-note { font-size: 9.5px !important; margin-top: 4px; }

/* ─── PHASE TIMELINE ───────────────────────────────────────────────────── */
.phasebar { width: 100%; margin: 0 0 16px; }
.phasebar-track {
  display: flex;
  border: 1px solid var(--tbl-row-border);
  background: var(--tbl-bg);
  backdrop-filter: blur(var(--tbl-blur));
  -webkit-backdrop-filter: blur(var(--tbl-blur));
}
.phasebar-cell {
  flex: 1;
  padding: 18px 16px;
  border: 0;
  border-right: 1px solid var(--tbl-row-border);
  text-align: left;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background .15s;
  min-width: 0;
}
.phasebar-cell:last-child { border-right: 0; }
.phasebar-cell:hover { background: var(--tbl-bg-hover); }
.phasebar-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.phasebar-star { color: var(--accent); display: inline-flex; }
.phasebar-title {
  font-family: var(--serif);
  font-size: 17px;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
  line-height: 1.15;
}
.phasebar-period { font-size: 10px; color: var(--dim); margin-bottom: 4px; }
.phasebar-budget { font-size: 11px; color: var(--accent); }

.phasebar-now { background: var(--surface-2); }
.phasebar-now .phasebar-title { color: var(--ink); }
.phasebar-next { border-top: 2px solid var(--accent); }
.phasebar-planned { opacity: 0.85; }
.phasebar-horizon { opacity: 0.55; }

.phasebar-legend {
  display: flex; gap: 24px; flex-wrap: wrap;
  font-size: 10.5px;
  padding-top: 8px;
}
.phasebar-legend .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 0; }
.dot-now { background: var(--ink); }
.dot-next { background: var(--accent); }
.dot-planned { background: var(--ink-2); opacity: 0.7; }
.dot-horizon { background: var(--dim); }

@media (max-width: 900px) {
  .phasebar-track { flex-direction: column; }
  .phasebar-cell { border-right: 0; border-bottom: 1px solid var(--line); }
}

/* ─── TECH STACK GRID ──────────────────────────────────────────────────── */
.techgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 800px) { .techgrid { grid-template-columns: 1fr; } }

/* ─── TECH STACK кликабельные карточки + отдельная панель деталей ───────── */
.tech-clickable { padding: 0; }
.tech-clickable-btn {
  width: 100%; display: block;
  padding: 24px;
  background: transparent; border: 0; text-align: left;
  cursor: pointer;
  font-family: inherit; color: inherit;
  transition: background .15s;
}
.tech-clickable-btn:hover { background: var(--tbl-bg-hover); }
.tech-clickable.is-active { border-color: var(--accent); }
.tech-clickable.is-active .tech-clickable-btn { background: var(--tbl-bg-active); }

.tech-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 14px;
  font-size: 10.5px;
}
.tech-caret {
  font-size: 10.5px;
  color: var(--accent);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Полная панель деталей под grid'ом */
.tech-detail {
  margin-top: 16px;
  padding: 32px 36px;
  background: var(--tbl-bg);
  backdrop-filter: blur(var(--tbl-blur));
  -webkit-backdrop-filter: blur(var(--tbl-blur));
  border: 1px solid var(--accent);
  position: relative;
  animation: chapterSlide .3s ease-out;
}
.tech-detail::before, .tech-detail::after {
  content: ''; position: absolute; width: 10px; height: 10px;
  border: 1px solid var(--accent);
}
.tech-detail::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.tech-detail::after  { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }

.tech-detail-head {
  display: flex; justify-content: space-between; align-items: start; gap: 24px;
  padding-bottom: 20px;
  border-bottom: 1px dashed var(--line-strong);
  margin-bottom: 24px;
}
.tech-detail-head .mono.dim {
  font-size: 10.5px; letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.tech-detail-title {
  font-family: var(--serif);
  font-size: clamp(22px, 2.6vw, 30px);
  font-weight: 400;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  text-wrap: balance;
}
.tech-detail-sub {
  font-size: 11px;
  margin-top: 4px;
}
.tech-detail-close {
  background: none; border: 1px solid var(--line-strong);
  padding: 8px 14px; cursor: pointer;
  font-size: 11px; letter-spacing: 0.08em;
  color: var(--ink-2);
  transition: all .15s;
  flex-shrink: 0;
}
.tech-detail-close:hover { border-color: var(--ink); color: var(--ink); }

/* Метрики 4 в ряд */
.tech-detail-metrics {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--tbl-row-border);
}
@media (max-width: 800px) { .tech-detail-metrics { grid-template-columns: repeat(2, 1fr); } }
.tech-metric-k { font-size: 10px; letter-spacing: 0.08em; margin-bottom: 6px; }
.tech-metric-v {
  font-family: var(--serif);
  font-size: 17px;
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: var(--ink);
}

.tech-detail-text {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.65;
  color: var(--ink-2);
  margin: 0 0 24px;
  max-width: 80ch;
}

.tech-detail-forud {
  padding: 18px 22px;
  background: var(--accent-soft);
  border-left: 3px solid var(--accent);
  margin-bottom: 24px;
}
.tech-detail-forud .mono.dim {
  display: block;
  font-size: 10.5px; letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 8px;
}
.tech-detail-forud p {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px; line-height: 1.6;
  color: var(--ink);
}

.tech-detail-sources .mono.dim {
  display: block;
  font-size: 10.5px; letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.tech-detail-sources ul {
  list-style: none; margin: 0; padding: 0;
}
.tech-detail-sources li {
  padding: 10px 0;
  border-bottom: 1px dashed var(--tbl-row-border);
}
.tech-detail-sources li:last-child { border-bottom: 0; }
.tech-detail-sources a {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px;
  color: var(--ink-2);
  transition: color .15s;
}
.tech-detail-sources a:hover { color: var(--accent); }
.tech-detail-sources a svg { opacity: 0.6; }
@media (max-width: 600px) {
  .tech-detail { padding: 22px; }
}
.tech { padding: 24px; transition: transform .15s, border-color .15s; }
.tech:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.tech-id {
  display: inline-block;
  font-size: 10.5px;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 3px 8px;
  margin-bottom: 16px;
}
.tech-what { font-size: 17px; margin-bottom: 12px; line-height: 1.3; }
.tech-proof { font-size: 11px; color: var(--ink-2); margin-bottom: 4px; text-transform: none; letter-spacing: 0.02em; }
.tech-city { font-size: 10.5px; color: var(--dim); }

/* ─── CHAPTERS INDEX ───────────────────────────────────────────────────── */
.chapters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
@media (max-width: 700px) { .chapters { grid-template-columns: 1fr; } }
.chapter {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  background: var(--bg);
  transition: background .15s;
}
.chapter:hover { background: var(--surface); }
.chapter-n { color: var(--accent); font-size: 14px; }
.chapter-t { font-size: 15px; }
.chapter-meta { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--dim); }
.chip {
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
}
.chip-new { background: var(--accent); color: var(--bg); }
.chip-upd { border: 1px solid var(--line-strong); color: var(--ink-2); }

/* ─── CHAPTERS ACCORDION ───────────────────────────────────────────────── */
.chapters-acc {
  border: 1px solid var(--tbl-row-border);
  background: var(--tbl-bg);
  backdrop-filter: blur(var(--tbl-blur));
  -webkit-backdrop-filter: blur(var(--tbl-blur));
}
.chapter-acc {
  border-bottom: 1px solid var(--tbl-row-border);
}
.chapter-acc:last-child { border-bottom: 0; }
.chapter-acc-head {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: var(--tbl-pad-y) var(--tbl-pad-x);
  width: 100%;
  text-align: left;
  background: transparent;
  cursor: pointer;
  transition: background .15s;
  border: 0;
}
.chapter-acc-head:hover { background: var(--tbl-bg-hover); }
.chapter-acc.is-open .chapter-acc-head {
  background: var(--tbl-bg-active);
  border-bottom: 1px solid var(--tbl-row-border-active);
}
.chapter-acc.is-open .chapter-caret { color: var(--accent); }
.chapter-caret {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--dim);
  width: 16px; text-align: center;
  transition: color .15s;
}
.chapter-d { font-size: 10.5px; }
.chapter-acc-body {
  padding: 20px 24px 28px 76px;
  background: var(--tbl-bg-active);
  border-top: 0;
  animation: chapterSlide .25s ease-out;
}
@keyframes chapterSlide {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.chapter-acc-text {
  font-family: var(--serif);
  font-size: 16.5px;
  line-height: 1.6;
  color: var(--ink-2);
  margin: 0 0 16px;
  max-width: 70ch;
}
.chapter-acc-kw {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin: 0 0 16px;
}
.chapter-acc-foot {
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.chapter-acc-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.chapter-acc-link:hover { text-decoration: underline; }
@media (max-width: 700px) {
  .chapter-acc-body { padding: 20px 20px 28px 20px; }
  .chapter-acc-head { grid-template-columns: 40px 1fr auto; gap: 10px; }
}

/* ─── 4 СЦЕНАРИЯ ЗАГРУЗКИ (loadgrid) ───────────────────────────────────── */
.loadgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
@media (max-width: 900px) { .loadgrid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .loadgrid { grid-template-columns: 1fr; } }
.loadcard {
  padding: 20px;
  display: flex; flex-direction: column; gap: 6px;
}
.loadcard-name {
  font-size: 11px; letter-spacing: 0.08em;
  color: var(--dim); margin-bottom: 6px;
}
.loadcard-traffic {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--ink-2);
}
.loadcard-cost {
  font-family: var(--serif);
  font-size: 26px;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.loadcard-desc {
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--ink-2);
  margin: 0;
}
.loadcard-best  .loadcard-cost { color: var(--signal); }
.loadcard-best  { border-color: var(--signal); }
.loadcard-good  .loadcard-cost { color: var(--accent); }
.loadcard-good  { border-color: var(--accent); }
.loadcard-med   .loadcard-cost { color: var(--warn); }
.loadcard-bad   .loadcard-cost { color: var(--danger); }
.loadcard-bad   { border-color: var(--danger); }

/* ─── РЫЧАГИ $/кг (LeversAccordion) ────────────────────────────────────── */
.levers-acc {
  border: 1px solid var(--tbl-row-border);
  background: var(--tbl-bg);
  backdrop-filter: blur(var(--tbl-blur));
  -webkit-backdrop-filter: blur(var(--tbl-blur));
  margin-bottom: 32px;
}
.levers-acc-head,
.lev-row-head {
  display: grid;
  grid-template-columns: 40px 1fr 90px 110px 90px 90px;
  gap: 12px;
  align-items: center;
  padding: var(--tbl-pad-y) var(--tbl-pad-x);
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.levers-acc-head {
  cursor: default;
  background: var(--tbl-header-bg);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--tbl-row-border);
}
.lev-row { border-bottom: 1px solid var(--tbl-row-border); }
.lev-row:last-child { border-bottom: 0; }
.lev-row-head:hover { background: var(--tbl-bg-hover); }
.lev-row.is-open .lev-row-head {
  background: var(--tbl-bg-active);
  border-bottom: 1px solid var(--tbl-row-border-active);
}
.lev-n { color: var(--accent); font-size: 12px; }
.lev-name { font-size: 14.5px; }
.lev-cap, .lev-load, .lev-cost, .lev-tier {
  font-size: 12px;
  letter-spacing: 0.04em;
}
.lev-cost { color: var(--accent); font-weight: 500; }
.lev-tier { color: var(--dim); }
.tier-1 .lev-cost { font-size: 14px; }
.lev-row-body {
  padding: 16px 24px 22px 70px;
  background: var(--tbl-bg-active);
  animation: chapterSlide .25s ease-out;
}
.lev-row-body p {
  margin: 0;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 70ch;
}
.lev-row-total {
  background: rgba(255,91,31,0.08);
  border-top: 2px solid var(--accent);
}
.lev-row-total .lev-row-head { cursor: default; padding: 18px; }
.lev-row-total .lev-name b { color: var(--ink); }
.lev-row-total .lev-cost { font-size: 14px; }
@media (max-width: 900px) {
  .levers-acc-head, .lev-row-head {
    grid-template-columns: 30px 1fr 70px 70px;
    gap: 8px; font-size: 11px;
  }
  .lev-load, .lev-tier { display: none; }
  .lev-row-body { padding: 12px 16px 16px 50px; }
}

.levers-bottom { margin-top: 32px; }
.levers-final {
  padding: 28px 32px;
  border-color: var(--accent);
}
.levers-final-price {
  font-family: var(--serif);
  font-size: 56px;
  letter-spacing: -0.025em;
  color: var(--accent);
  margin: 8px 0 12px;
  line-height: 1;
}
.levers-final-note {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink-2);
  margin: 0;
  max-width: 80ch;
}

/* ─── Иллюстрации (chart-fig + chart-svg) ──────────────────────────────── */
.chart-fig {
  margin: 32px 0 0;
  padding: 32px 24px 20px;
  background: rgba(20, 24, 29, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  position: relative;
}
.chart-fig::before, .chart-fig::after {
  content: ''; position: absolute; width: 8px; height: 8px;
  border: 1px solid var(--accent);
}
.chart-fig::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.chart-fig::after  { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
.chart-svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 920px;
  margin: 0 auto;
}
.chart-cap {
  margin-top: 16px;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-align: center;
}

/* ─── PHASE TIMELINE EXPANDABLE ────────────────────────────────────────── */
.phasebar-x { width: 100%; }
.phasebar-cell.is-open {
  background: var(--tbl-bg-active);
  outline: 1px solid var(--accent);
  outline-offset: -1px;
}
.phasebar-detail {
  margin-top: -1px;
  padding: 28px 32px;
  background: var(--tbl-bg);
  backdrop-filter: blur(var(--tbl-blur));
  -webkit-backdrop-filter: blur(var(--tbl-blur));
  border: 1px solid var(--accent);
  animation: chapterSlide .25s ease-out;
}
.phasebar-detail-head {
  display: flex; justify-content: space-between; align-items: start; gap: 16px;
  padding-bottom: 16px; border-bottom: 1px dashed var(--line-strong);
  margin-bottom: 16px;
}
.phasebar-detail-title {
  font-family: var(--serif);
  font-size: 28px; font-weight: 400; letter-spacing: -0.02em;
  margin: 4px 0 0;
}
.phasebar-detail-close {
  background: none; border: 1px solid var(--line-strong);
  padding: 6px 12px; cursor: pointer;
  font-size: 11px; letter-spacing: 0.08em;
  color: var(--ink-2);
  transition: border-color .15s, color .15s;
}
.phasebar-detail-close:hover { border-color: var(--ink); color: var(--ink); }
.phasebar-detail-what {
  font-family: var(--serif);
  font-size: 17px; line-height: 1.55;
  color: var(--ink); margin: 0 0 20px;
}
.phasebar-detail-h {
  font-size: 10.5px; letter-spacing: 0.1em;
  margin-bottom: 8px; display: block;
}
.phasebar-detail-list {
  margin: 0 0 20px; padding-left: 20px;
  color: var(--ink-2); line-height: 1.7;
}
.phasebar-detail-list li { margin-bottom: 4px; font-size: 14.5px; }
.phasebar-detail-gate {
  padding: 14px 16px;
  background: var(--accent-soft);
  border-left: 2px solid var(--accent);
}
.phasebar-detail-gate p { margin: 6px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink); }

/* ─── QUOTE ────────────────────────────────────────────────────────────── */
.quote-section { padding: 64px 24px; }
.quote {
  max-width: 760px; margin: 0 auto;
  text-align: left;
  padding: 0 0 0 32px;
  border-left: 2px solid var(--accent);
  position: relative;
}
.quote-mark {
  position: absolute; left: -8px; top: -16px;
  color: var(--accent);
  font-size: 56px;
  line-height: 1;
  background: var(--bg);
  padding: 0 4px;
}
.quote-body {
  font-family: var(--serif);
  font-size: clamp(20px, 2.4vw, 28px);
  line-height: 1.4;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0 0 16px;
}
.quote-after {
  font-family: var(--serif);
  font-style: italic;
  font-size: 17px;
  color: var(--ink-2);
  margin: 0;
}

/* ─── CHANGELOG ────────────────────────────────────────────────────────── */
.changelog { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
.changelog-item {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 32px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
}
@media (max-width: 600px) { .changelog-item { grid-template-columns: 1fr; gap: 8px; } }
.changelog-date { color: var(--dim); padding-top: 4px; font-size: 11px; }
.changelog-title { font-size: 17px; margin-bottom: 8px; }
.changelog-bullets { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
.changelog-bullets li { margin-bottom: 4px; }

/* ─── FOOTER ───────────────────────────────────────────────────────────── */
.footer {
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  margin-top: 48px;
}
.footer-grid {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 56px 24px 32px;
  display: grid;
  grid-template-columns: 1.6fr 1fr 1.2fr 1.4fr;
  gap: 40px;
}
@media (max-width: 900px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
@media (max-width: 600px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-h { font-size: 11px; color: var(--dim); margin-bottom: 14px; }
.footer-tagline { font-family: var(--serif); font-size: 19px; margin-top: 6px; line-height: 1.3; }
.footer-note { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin: 16px 0 0; }

}

.roadmap-goals {

}

  align-items: center;

  border-bottom: 1px solid var(--tbl-row-border);
}
.legal-item:last-child { border-bottom: 0; }
.legal-check {
  font-size: 18px;
  color: var(--dim);
  text-align: center;
}
.legal-item.is-done .legal-check { color: var(--signal); }
.legal-item.is-done .legal-step { text-decoration: line-through; color: var(--dim); }

.legal-eta { font-size: 11px; }

/* Прозрачность */

  margin: 0; padding: 24px 28px;

  border: 1px solid var(--tbl-row-border);
  background: var(--tbl-bg);
  backdrop-filter: blur(var(--tbl-blur));

  line-height: 1.55;
  color: var(--ink-2);

  position: absolute;
  left: 0; top: 8px;
  color: var(--signal);
  font-weight: bold;

.channel-handle { font-size: 11px; color: var(--accent); margin-top: 2px; grid-column: 1; }

@media (prefers-reduced-motion: no-preference) {

  .pillars .pillar:nth-child(3) { animation-delay: .16s; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }

// ─── SVG: Waterfall-диаграмма удельная $/кг по интенсивности эксплуатации ───
const WaterfallChart = () => {
  const start = 500;  // $/кг удельная в сценарии 200 пусков/год (минимум суверенитета)
  // Δ подобраны так, чтобы start + Σδ ≈ 220 (удельная в сценарии 1000 пусков/год)
  const steps = [
    { label: '200 пусков/год',     delta: 0,    fill: '#4a5058', isStart: true },
    { label: '01 · 500 пусков',    delta: -120, fill: '#ff5b1f' },
    { label: '02 · многораз. ГПВРД', delta: -80,  fill: '#ff5b1f' },
    { label: '03 · 1000 пусков',   delta: -50,  fill: '#ff7340' },
    { label: '04 · АЭС-tariff',    delta: -15,  fill: '#ff7340' },
    { label: '05 · унификация',    delta: -10,  fill: '#ff7340' },
    { label: '06 · He-recovery',   delta: -3,   fill: '#ff8a55' },
    { label: '07 · криогеника',    delta: -2,   fill: '#ff8a55' },
    { label: 'Итог',               delta: 0,    fill: '#4dd0a0', isEnd: true },
  ];
  const W = 900, H = 360, padL = 60, padR = 30, padT = 40, padB = 80;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const barW = innerW / steps.length * 0.7;
  const gap = innerW / steps.length;
  const maxV = 600;  // верх шкалы
  const yScale = v => padT + innerH - (v / maxV) * innerH;
  let running = start;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart-svg" aria-label="Рычаги снижения $/кг">
      {/* gridlines */}
      {[0, 100, 200, 300, 400, 500, 600].map(v => (
        <g key={v}>
          <line x1={padL} y1={yScale(v)} x2={W - padR} y2={yScale(v)}
                stroke="#262c34" strokeWidth="0.5"/>
          <text x={padL - 8} y={yScale(v) + 4} fill="#6f7884"
                fontFamily="JetBrains Mono, monospace" fontSize="10" textAnchor="end">
            ${v}
          </text>
        </g>
      ))}
      {/* bars */}
      {steps.map((s, i) => {
        const x = padL + gap * i + (gap - barW) / 2;
        let y, h, label;
        if (s.isStart) {
          y = yScale(start); h = innerH - (yScale(start) - padT);
          label = `$${start}`;
        } else if (s.isEnd) {
          y = yScale(running); h = innerH - (yScale(running) - padT);
          label = `$${Math.round(running)}`;
        } else {
          const top = running;
          running = running + s.delta;
          y = yScale(top);
          h = yScale(running) - yScale(top);
          label = `${s.delta > 0 ? '+' : ''}${s.delta}`;
        }
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={h} fill={s.fill} opacity={s.isStart||s.isEnd?0.85:0.7}/>
            <text x={x + barW/2} y={y - 6} fill="#e8ecf1"
                  fontFamily="JetBrains Mono, monospace" fontSize="10" textAnchor="middle">
              {label}
            </text>
            <text x={x + barW/2} y={H - padB + 16} fill="#b9c1cc"
                  fontFamily="Inter, sans-serif" fontSize="10" textAnchor="middle">
              {s.label.split(' · ')[0]}
            </text>
            {s.label.includes(' · ') && (
              <text x={x + barW/2} y={H - padB + 30} fill="#6f7884"
                    fontFamily="Inter, sans-serif" fontSize="9" textAnchor="middle">
                {s.label.split(' · ')[1]}
              </text>
            )}
          </g>
        );
      })}
      {/* connect dots between bar tops */}
      {steps.slice(1).map((s, i) => {
        if (s.isEnd) return null;
        return null; // упрощаем — без соединителей чтобы было чище
      })}
      {/* axis */}
      <line x1={padL} y1={padT + innerH} x2={W - padR} y2={padT + innerH}
            stroke="#3a424c" strokeWidth="1"/>
    </svg>
  );
};

    { id: 'C3', name: 'Стандартные спутники', desc: 'Связные / SSO / polar' },
    { id: 'C4', name: 'Точная аппаратура', desc: 'Оптика / телескопы / экипажи' },

    { name: 'Допуск 4,5g spike',   cost: '0,5 сек drag',     values: [ 1,  1,  0, -1] },
    { name: 'Орбита 65°+',         cost: 'SSO/polar/Молния', values: [ 1,  1,  1,  0] },
    { name: 'Массовый цикл 500/год',   cost: 'десятилетний поток', values: [ 1,  1,  0, -1] },

  const W = 900, H = 400, padL = 140, padT = 80, padR = 40, padB = 30;

    <svg viewBox={`0 0 ${W} ${H}`} className="chart-svg" aria-label="Матрица применимости УД по нишам">

                fontSize="14" textAnchor="end">{r.name}</text>

                fill="#6f7884" fontFamily="JetBrains Mono, monospace"
                fontSize="10" textAnchor="end">{r.cost}</text>
          {r.values.map((v, ci) => {
            const x = padL + ci * colW;
            const y = padT + ri * rowH;
            return (
              <g key={ci}>
                <rect x={x + 1} y={y + 1} width={colW - 2} height={rowH - 2}

// ─── Единая trajectory-линия (продолжение орбиты hero вниз через всю страницу) ─
const GlobalTrajectory = ({ enabled }) => {
  const [pageH, setPageH] = useState(0);
  const [scrollY, setScrollY] = useState(0);
  useEffect(() => {
    if (!enabled) return;
    const update = () => {
      setPageH(document.documentElement.scrollHeight);
      setScrollY(window.scrollY);
    };
    update();
    window.addEventListener('resize', update);
    window.addEventListener('scroll', update, { passive: true });
    // ждём картинки/шрифты
    const t1 = setTimeout(update, 500);
    const t2 = setTimeout(update, 2000);
    return () => {
      window.removeEventListener('resize', update);
      window.removeEventListener('scroll', update);
      clearTimeout(t1); clearTimeout(t2);
    };
  }, [enabled]);

  if (!enabled || pageH < 200) return null;

  // Точки опор — соответствуют положению планет в секциях главной.
  // viewBox растягивается на ширину экрана (xMidYMin slice).
  const W = 1600;
  const points = [
    [820,   388],            // конец орбиты hero (где капсула)
    [220,   pageH * 0.13],   // Луна слева (Pillars)
    [1280,  pageH * 0.21],   // Луна справа (Прометей)
    [220,   pageH * 0.31],   // Марс слева (Roadmap)
    [1280,  pageH * 0.40],   // Юпитер (LoadScenarios)
    [800,   pageH * 0.49],   // Туманность (Levers)
    [1280,  pageH * 0.58],   // Юпитер (CAPEX)
    [1280,  pageH * 0.66],   // Нептун (StarshipMatrix)
    [1280,  pageH * 0.75],   // Меркурий (TechStack)
    [800,   pageH * 0.83],   // Сатурн (Chapters)
    [1280,  pageH * 0.91],   // Нептун (Quote)
    [800,   pageH * 0.97],   // финал — туманность (Changelog)
  ];

  // Smooth path с большим изгибом (control points отклонены)
  let d = `M ${points[0][0]} ${points[0][1]}`;
  for (let i = 1; i < points.length; i++) {
    const [x1, y1] = points[i - 1];
    const [x2, y2] = points[i];
    // Control points для C-кривой — мягкие S-образные изгибы
    const c1x = x1, c1y = y1 + (y2 - y1) * 0.55;
    const c2x = x2, c2y = y2 - (y2 - y1) * 0.55;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
  }

  // Прогресс по скроллу — для пульсирующих маркеров
  const docH = Math.max(1, pageH - window.innerHeight);
  const progress = Math.max(0, Math.min(1, scrollY / docH));

  return (
    <svg className="global-trajectory" aria-hidden
         viewBox={`0 0 ${W} ${pageH}`}
         preserveAspectRatio="xMidYMin slice"
         style={{ height: pageH }}>
      <defs>
        <linearGradient id="trajGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stopColor="rgba(255,91,31,1)"/>
          <stop offset="40%"  stopColor="rgba(255,140,80,0.95)"/>
          <stop offset="80%"  stopColor="rgba(255,200,140,0.85)"/>
          <stop offset="100%" stopColor="rgba(255,240,200,0.7)"/>
        </linearGradient>
        <filter id="trajGlow" x="-20%" y="-2%" width="140%" height="104%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      {/* Glow-подложка — широкий мягкий ореол */}
      <path d={d} fill="none" stroke="rgba(255,91,31,0.3)"
            strokeWidth="14" strokeLinecap="round"
            filter="url(#trajGlow)"/>

      {/* Основная линия — яркая сплошная, видна сразу */}
      <path d={d} fill="none" stroke="url(#trajGrad)"
            strokeWidth="3" strokeLinecap="round"/>

      {/* Опорные точки — планеты на маршруте */}
      {points.map((p, i) => {
        const isReached = (i / (points.length - 1)) <= progress + 0.05;
        return (
          <g key={i} transform={`translate(${p[0]}, ${p[1]})`}>
            <circle r="6" fill={isReached ? '#ff5b1f' : 'rgba(255,91,31,0.55)'}/>
            <circle r="3" fill="#fff" opacity="0.9"/>
            <circle r="14" fill="none" stroke="#ff5b1f"
                    strokeWidth="1" opacity="0.6">
              <animate attributeName="r" values="10;20;10"
                       dur="3s" repeatCount="indefinite" begin={`${i * 0.3}s`}/>
              <animate attributeName="opacity" values="0.6;0;0.6"
                       dur="3s" repeatCount="indefinite" begin={`${i * 0.3}s`}/>
            </circle>
          </g>
        );
      })}
    </svg>
  );
};

<script type="text/babel" data-presets="react">
// app.jsx — top-level routing
const { useState: uS, useEffect: uE } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentHue": 18,
  "fontScale": 1.0,
  "showGrid": true
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = uS(() => {
    const h = (window.location.hash || '').replace('#','');
    return h && window.SITE_DATA.menu.find(m => m.id===h) ? h : 'home';
  });
  const data = window.SITE_DATA;

  uE(() => {
    window.location.hash = route;
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, [route]);

  uE(() => {
    const onHash = () => {
      const h = (window.location.hash || '').replace('#','');
      if (h && data.menu.find(m=>m.id===h)) setRoute(h);
      else if (!h) setRoute('home');
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  let Page;
  switch (route) {
    case 'phase05':     Page = <PagePhase05 data={data} setRoute={setRoute}/>; break;
    case 'roadmap':     Page = <PageRoadmap data={data} setRoute={setRoute}/>; break;
    case 'competitors': Page = <PageCompetitors data={data} setRoute={setRoute}/>; break;
    case 'concept':     Page = <PageConcept data={data} setRoute={setRoute}/>; break;
    case 'site':        Page = <PageSite data={data} setRoute={setRoute}/>; break;
    case 'economics':   Page = <PageEconomics data={data} setRoute={setRoute}/>; break;
    case 'blog':        Page = <PageBlog data={data} setRoute={setRoute}/>; break;
    case 'funding':     Page = <PageFunding data={data} setRoute={setRoute}/>; break;
    case 'support':     Page = <PageSupport data={data} setRoute={setRoute}/>; break;
    default:            Page = <PageHome data={data} setRoute={setRoute}/>;
  }

  return (
    <div className="app" data-route={route}>
      <RouteBackdrop route={route}/>
      <GlobalTrajectory enabled={route === 'home'}/>
      <ScrollProgress/>
      <ChromeNav data={data} route={route} setRoute={setRoute}/>
      {Page}
      <ChromeFooter data={data} setRoute={setRoute}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

</script>
