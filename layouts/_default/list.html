<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ .Title }} — Урал-Драйвер</title>
<meta name="description" content="{{ .Description }}"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<style>
:root {
  --bg: #0d1525;
  --bg-2: #131c30;
  --ink: #d8e6f5;
  --ink-2: #9fb3cc;
  --dim: #6a829f;
  --accent: #4ec3d4;
  --accent-2: #6ee0a3;
  --warn: #ffb45e;
  --frame: rgba(255,255,255,0.08);
  --frame-2: rgba(255,255,255,0.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.mono { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing: 0.3px; }
.dim { color: var(--dim); }

.page-nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(13,21,37,0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--frame);
  padding: 14px 24px;
}
.page-nav-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 20px; }
.page-nav a {
  color: var(--accent); text-decoration: none; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: opacity .15s;
}
.page-nav a:hover { opacity: 0.75; }
.page-nav-title { color: var(--ink); font-weight: 600; flex: 1; }
.page-nav-code { font-size: 12px; }

.page-container {
  max-width: 880px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}
.page-header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--frame); }
.page-h1 { font-size: 38px; font-weight: 700; margin: 0 0 12px; line-height: 1.15; color: var(--ink); }
.page-desc { font-size: 17px; color: var(--ink-2); margin: 0; }

article {
  font-size: 16.5px;
  line-height: 1.75;
}
article h2 {
  font-size: 26px; font-weight: 700; margin: 48px 0 18px; color: var(--ink);
  padding-bottom: 10px; border-bottom: 1px solid var(--frame);
}
article h3 { font-size: 20px; font-weight: 600; margin: 32px 0 12px; color: var(--ink); }
article h4 { font-size: 17px; font-weight: 600; margin: 24px 0 8px; color: var(--accent); }
article p { margin: 0 0 16px; color: var(--ink-2); }
article a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed rgba(78,195,212,0.4); }
article a:hover { border-bottom-style: solid; }
article ul, article ol { padding-left: 24px; margin: 0 0 20px; color: var(--ink-2); }
article li { margin-bottom: 6px; }
article strong { color: var(--ink); font-weight: 600; }
article code {
  background: var(--bg-2); padding: 2px 6px; border-radius: 3px;
  font-family: "SF Mono", Menlo, monospace; font-size: 14px; color: var(--accent-2);
}
article blockquote {
  margin: 20px 0; padding: 16px 20px;
  border-left: 3px solid var(--accent);
  background: rgba(78,195,212,0.06);
  border-radius: 0 4px 4px 0;
  color: var(--ink-2); font-style: italic;
}
article blockquote p:last-child { margin-bottom: 0; }
article img {
  max-width: 100%; height: auto; display: block; margin: 24px auto;
  border-radius: 4px; border: 1px solid var(--frame-2);
}
article table {
  width: 100%; border-collapse: collapse; margin: 20px 0;
  font-size: 14.5px;
}
article th, article td {
  text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--frame);
}
article th { color: var(--accent); font-weight: 600; background: var(--bg-2); }
article tr:hover td { background: rgba(255,255,255,0.02); }

.page-footer {
  max-width: 880px; margin: 40px auto 0; padding: 24px;
  border-top: 1px solid var(--frame); text-align: center;
  color: var(--dim); font-size: 13px;
}
.page-footer a { color: var(--accent); text-decoration: none; margin: 0 12px; }
.page-footer a:hover { opacity: 0.75; }

@media (max-width: 600px) {
  .page-h1 { font-size: 28px; }
  .page-container { padding: 32px 16px 64px; }
  article h2 { font-size: 22px; }
  article { font-size: 15.5px; }
}
</style>
</head>
<body>
<nav class="page-nav">
  <div class="page-nav-inner">
    <a href="/">← Главная</a>
    <span class="mono dim page-nav-code">// {{ .Section | upper }}</span>
    <span class="page-nav-title">{{ .Title }}</span>
  </div>
</nav>

<main class="page-container">
  <header class="page-header">
    <h1 class="page-h1">{{ .Title }}</h1>
    {{ with .Description }}<p class="page-desc">{{ . }}</p>{{ end }}
  </header>

  <article>
    {{ .Content }}
  </article>
</main>

<footer class="page-footer">
  <a href="/">← На главную</a>
  <a href="/support/">Поддержать проект</a>
  <a href="https://github.com/antonkuzmenkov/uraldriver-site" target="_blank" rel="noopener">GitHub</a>
  <div style="margin-top:12px;opacity:0.7">© 2026 Урал-Драйвер · открытый концепт</div>
</footer>
</body>
</html>
