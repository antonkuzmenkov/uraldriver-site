<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<title>{{ .Title }} — Урал-Драйвер</title>
<script>
  (function(){
    var path = '{{ .RelPermalink }}';
    var hash = 'home';
    if (path.indexOf('phase-05') !== -1)        hash = 'phase05';
    else if (path.indexOf('phase-')  !== -1)    hash = 'roadmap';
    else if (path.indexOf('concept') !== -1)    hash = 'concept';
    else if (path.indexOf('site')    !== -1)    hash = 'site';
    else if (path.indexOf('economics')!== -1)   hash = 'economics';
    else if (path.indexOf('roadmap') !== -1)    hash = 'roadmap';
    else if (path.indexOf('competitors')!== -1) hash = 'competitors';
    else if (path.indexOf('blog')    !== -1)    hash = 'blog';
    else if (path.indexOf('support') !== -1)    hash = 'support';
    window.location.replace('/#' + hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=/"/>
</head>
<body><p>Открытие <a href="/">главной</a>...</p></body>
</html>
